<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Event Management & Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2>EventHub</h2>

        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#events">Events</a>
            <a href="#booking">Book Ticket</a>
            <a href="#bookings">My Bookings</a>
        </div>
    </nav>
</header>

<section id="home" class="hero">
    <div>
        <h1>Discover & Book Amazing Events</h1>
        <p>Find your favorite events and book your tickets easily.</p>
        <a href="#events" class="btn">Explore Events</a>
    </div>
</section>

<section id="events" class="section">
    <h2>Upcoming Events</h2>

    <div class="controls">
        <input type="text" id="search" placeholder="Search event...">

        <select id="category">
            <option value="all">All Categories</option>
            <option value="Music">Music</option>
            <option value="Technology">Technology</option>
            <option value="Sports">Sports</option>
            <option value="Cultural">Cultural</option>
        </select>
    </div>

    <div id="eventContainer" class="event-container"></div>
</section>

<section id="booking" class="section booking-section">
    <h2>Book Your Ticket</h2>

    <form id="bookingForm">

        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Select Event</label>
        <select id="eventSelect" required>
            <option value="">Select Event</option>
        </select>

        <label>Number of Tickets</label>
        <input type="number" id="tickets" min="1" max="10" value="1" required>

        <p class="price">
            Total Price: ₹<span id="totalPrice">0</span>
        </p>

        <button type="submit" class="btn">Confirm Booking</button>
    </form>
</section>

<section id="bookings" class="section">
    <h2>My Bookings</h2>

    <div id="bookingList"></div>
</section>

<footer>
    <p>© 2026 EventHub | Event Management & Ticket Booking System</p>
</footer>

<script src="script.js"></script>
</body>
</html>
